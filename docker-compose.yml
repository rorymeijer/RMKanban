# Board — self-hosted Kanban.
#
#   git clone → docker compose up -d → wijs je Caddy naar :8080 → open het domein
#
# Deze stack brengt GEEN reverse proxy of TLS mee. Eén platte HTTP-poort (8080).
# postgres en valkey zijn NIET naar de host gemapt (alleen intern netwerk).

x-app-env: &app-env
  APP_NAME: Board
  APP_ENV: production
  APP_DEBUG: "false"
  # APP_KEY / APP_SECRET blijven leeg: het entrypoint genereert ze eenmalig.
  APP_KEY: ""
  APP_SECRET: ""
  # Zet dit naar je eigen domein, bv. https://board.voorbeeld.nl
  APP_URL: ${APP_URL:-http://localhost:8080}

  # Database — vaste interne credentials. Veilig omdat postgres alleen op het
  # interne docker-netwerk zit. De gebruiker raakt dit nooit aan.
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: board
  DB_USERNAME: board
  DB_PASSWORD: board_internal_secret

  # Cache / sessions / queues via Valkey (Redis-compatibel).
  REDIS_CLIENT: predis
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  # Meilisearch (interne host).
  SCOUT_DRIVER: meilisearch
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: ${MEILISEARCH_KEY:-board_meili_master_key}

  # Reverb websockets — draaien via hetzelfde domein (nginx proxyt /app + /apps).
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-board}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-board_reverb_key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-board_reverb_secret}
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  # Wat de browser gebruikt: hetzelfde domein, standaard poort, wss via Caddy.
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"

  # Achter Caddy staan we altijd achter een proxy: vertrouw de forwarded headers.
  TRUSTED_PROXIES: "*"

  # Applicatie-instellingen (verder instelbaar via env).
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-25}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}

  # Licentie: de publieke sleutel en handhaving zitten in de code (config/license.php),
  # bewust NIET hier — zo is het geen instelling die de klant even aanpast.
  # De klant voert zijn licentiesleutel in de installer in.

  # SMTP (optioneel; ook in te vullen in de installer of het adminpaneel).
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-board@localhost}

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-dev}
  image: board-app:${APP_VERSION:-dev}
  restart: unless-stopped
  volumes:
    - app_storage:/var/www/html/storage/app
  networks: [board]

services:
  app:
    <<: *app-build
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [board]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: board
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board_internal_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [board]
    # BEWUST geen ports: alleen bereikbaar op het interne netwerk.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d board"]
      interval: 10s
      timeout: 5s
      retries: 6

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    networks: [board]
    # BEWUST geen ports.
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-board_meili_master_key}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks: [board]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  reverb:
    <<: *app-build
    environment:
      <<: *app-env
      CONTAINER_ROLE: reverb
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [board]

  queue-worker:
    <<: *app-build
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=1"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

  scheduler:
    <<: *app-build
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

volumes:
  pg_data:
  meili_data:
  app_storage:

networks:
  board:
    driver: bridge
