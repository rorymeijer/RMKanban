; Board — production PHP settings.
memory_limit = 256M
; Generous transport ceiling; the effective per-upload limit is enforced in the
; application from the MAX_UPLOAD_SIZE env var (see config/board.php).
upload_max_filesize = 100M
post_max_size = 105M
max_execution_time = 60
expose_php = Off
date.timezone = UTC

; OPcache — tuned for a long-running php-fpm.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload_user = www-data
